name: Build iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Fix object version
        run: sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' *.xcodeproj/project.pbxproj || true
      - name: Build
        run: xcodebuild -project *.xcodeproj -scheme EasyWriting -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Create IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r EasyWriting-unsigned.ipa Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyWriting-unsigned
          path: EasyWriting-unsigned.ipa
