name: Build Music IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-music.yml'

permissions:
  contents: write

jobs:
  build-music:
    runs-on: macos-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout Music source (private)
        uses: actions/checkout@v4
        with:
          repository: 1314a520al-cyber/music
          token: ${{ secrets.GH_PAT }}
          path: music-source

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bump build number
        id: bump
        working-directory: music-source
        run: |
          python3 - <<'PYEOF'
          import re
          path = 'project.yml'
          with open(path) as f:
              content = f.read()
          def bump_build(m):
              return 'CURRENT_PROJECT_VERSION: "' + str(int(m.group(1)) + 1) + '"'
          content, n2 = re.subn(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', bump_build, content)
          with open(path, 'w') as f:
              f.write(content)
          ver = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', content).group(1)
          build = re.search(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', content).group(1)
          print('::notice title=Version::Building %s (build %s)' % (ver, build))
          with open('version.txt', 'w') as f:
              f.write(ver)
          with open('build.txt', 'w') as f:
              f.write(build)
          PYEOF

      - name: Generate Xcode project
        working-directory: music-source
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: music-source
        run: |
          VER=$(cat version.txt)
          BUILD=$(cat build.txt)
          echo "Building with MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=$BUILD"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$VER" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v$VER" >> "$GITHUB_ENV"
          xcodebuild \
            -project Music.xcodeproj \
            -scheme Music \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify version in built app
        working-directory: music-source
        run: |
          plutil -p build/Build/Products/Release-iphoneos/Music.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion"

      - name: Package IPA
        working-directory: music-source
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Music.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Music-unsigned.ipa
          ls -lh Music-unsigned.ipa

      - name: Package source zip
        working-directory: music-source
        run: |
          VER=$(cat version.txt)
          zip -qr "Music-${VER}-source.zip" Beans Widget android project.yml CHANGELOG.md README.md VERSIONING.md FEATURES.md docs 2>/dev/null || true
          ls -lh "Music-${VER}-source.zip"

      - name: Build release notes from CHANGELOG
        working-directory: music-source
        run: |
          python3 - <<'PYEOF'
          import re
          ver = open('version.txt').read().strip()
          content = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^##\s+' + re.escape(ver) + r'\s*$([\s\S]*?)(?=^##\s|\Z)', content, re.M)
          body = m.group(1).strip() if m else ('版本 ' + ver + ' 的更新内容。')
          body = '# Music ' + ver + '\n\n' + body + '\n'
          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          print(body)
          PYEOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-unsigned-ipa
          path: music-source/Music-unsigned.ipa
          retention-days: 90

      - name: Publish Release to Music repo
        working-directory: music-source
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          VER=$(cat version.txt)
          TAG="v${VER}"
          # 若 tag 已存在则删除（允许覆盖发布），再创建
          EXISTING_ID=$(curl -sL -H "Authorization: token ${GH_PAT}" "https://api.github.com/repos/1314a520al-cyber/music/releases/tags/${TAG}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$EXISTING_ID" ]; then
            curl -sL -X DELETE -H "Authorization: token ${GH_PAT}" "https://api.github.com/repos/1314a520al-cyber/music/releases/${EXISTING_ID}"
            echo "deleted existing release $EXISTING_ID"
          fi
          curl -sL -X DELETE -H "Authorization: token ${GH_PAT}" "https://api.github.com/repos/1314a520al-cyber/music/git/refs/tags/${TAG}" || true
          # 创建 release
          BODY=$(python3 -c "
import json
body = open('release_body.md', encoding='utf-8').read()
print(json.dumps(body))
")
          RESP=$(curl -sL -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/1314a520al-cyber/music/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Music ${VER}\",\"body\":${BODY}}")
          echo "$RESP"
          REL_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "release id: $REL_ID"
          echo "RELEASE_ID=$REL_ID" >> "$GITHUB_ENV"
          # 上传 IPA
          curl -sL -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/1314a520al-cyber/music/releases/${REL_ID}/assets?name=Music-${VER}.ipa" \
            --data-binary @Music-unsigned.ipa | python3 -c "import json,sys; d=json.load(sys.stdin); print('IPA asset:', d.get('name'), d.get('size'))"
          # 上传源码包
          curl -sL -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/1314a520al-cyber/music/releases/${REL_ID}/assets?name=Music-${VER}-source.zip" \
            --data-binary @"Music-${VER}-source.zip" | python3 -c "import json,sys; d=json.load(sys.stdin); print('source asset:', d.get('name'), d.get('size'))"
