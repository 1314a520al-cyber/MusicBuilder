name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布 GitHub Release'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/debug/
          echo "APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Music-android-v1.6.0.apk
          echo "APK_PATH=android/Music-android-v1.6.0.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-android-apk
          path: android/Music-android-v1.6.0.apk
          retention-days: 90

      - name: Build release notes
        run: |
          cat > release_body.md << 'EOF'
          # Music Android 1.6.0

          ### 新增与优化
          - 安卓版本首次发布，基于 Kotlin + Jetpack Compose
          - 支持网易云 / QQ音乐 / 酷狗 三平台搜索
          - 20 套主题配色，可在设置中切换
          - 歌词显示与点击跳转
          - 音乐源卡密验证，解锁 VIP 歌曲
          - 播放队列、收藏、播放模式切换

          ### 安装说明
          - 下载 Music-android-v1.6.0.apk
          - 在手机上允许安装未知来源应用
          - 点击 APK 文件安装
          EOF
          cat release_body.md

      - name: Publish Release
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.6.0-android
          name: Music Android 1.6.0
          body_path: android/release_body.md
          files: android/Music-android-v1.6.0.apk
          update_release_body: true
          update_release_name: true
          update_release_assets: true
