name: Music
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Music:
    type: application
    platform: iOS
    sources: [Beans]
    dependencies:
      - target: MusicWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.app
        MARKETING_VERSION: "2.10.11"
        CURRENT_PROJECT_VERSION: "85"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Beans/Music.entitlements
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  MusicWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.app.widget
        MARKETING_VERSION: "2.10.11"
        CURRENT_PROJECT_VERSION: "85"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: Widget/MusicWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Music 小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Music:
    build:
      targets:
        Music: all
        MusicWidget: all
    run:
      config: Debug
    archive:
      config: Release
