name: Article
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Article:
    type: application
    platform: iOS
    sources: [Beans]
    dependencies:
      - target: ArticleWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.article.app
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Beans/Article.entitlements
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: Article
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  ArticleWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.article.app.widget
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: Widget/ArticleWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Article 小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Article:
    build:
      targets:
        Article: all
        ArticleWidget: all
    run:
      config: Debug
    archive:
      config: Release
